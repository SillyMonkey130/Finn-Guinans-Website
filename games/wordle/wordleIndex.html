<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
        <title>Finn Guinan's Website</title>
        <link rel="stylesheet" href="wordleStyle.css">
    </head>
    <body>
        <div class="menu">
            <a href="../game.html" class="button">Back</a>
            <h1>Wordle</h1>
            <button onclick="reset()" class="button">Reset</button>
        </div>
        
        <div class="gameboard">
            <div id="container"></div>
            <div id="keys">
                <div class="rows">
                    <div class="letter" id="q" onclick="updateBoard('q')">Q</div>
                    <div class="letter" id="w" onclick="updateBoard('w')">W</div>
                    <div class="letter" id="e" onclick="updateBoard('e')">E</div>
                    <div class="letter" id="r" onclick="updateBoard('r')">R</div>
                    <div class="letter" id="t" onclick="updateBoard('t')">T</div>
                    <div class="letter" id="y" onclick="updateBoard('y')">Y</div>
                    <div class="letter" id="u" onclick="updateBoard('u')">U</div>
                    <div class="letter" id="i" onclick="updateBoard('i')">I</div>
                    <div class="letter" id="o" onclick="updateBoard('o')">O</div>
                    <div class="letter" id="p" onclick="updateBoard('p')">P</div>
                </div>
                <div class="rows">
                    <div class="letter" id="a" onclick="updateBoard('a')">A</div>
                    <div class="letter" id="s" onclick="updateBoard('s')">S</div>
                    <div class="letter" id="d" onclick="updateBoard('d')">D</div>
                    <div class="letter" id="f" onclick="updateBoard('f')">F</div>
                    <div class="letter" id="g" onclick="updateBoard('g')">G</div>
                    <div class="letter" id="h" onclick="updateBoard('h')">H</div>
                    <div class="letter" id="j" onclick="updateBoard('j')">J</div>
                    <div class="letter" id="k" onclick="updateBoard('k')">K</div>
                    <div class="letter" id="l" onclick="updateBoard('l')">L</div>
                </div>
                <div class="rows">
                    <div class="letter" onclick="enter()">ENTER</div>
                    <div class="letter" id="z" onclick="updateBoard('z')">Z</div>
                    <div class="letter" id="x" onclick="updateBoard('x')">X</div>
                    <div class="letter" id="c" onclick="updateBoard('c')">C</div>
                    <div class="letter" id="v" onclick="updateBoard('v')">V</div>
                    <div class="letter" id="b" onclick="updateBoard('b')">B</div>
                    <div class="letter" id="n" onclick="updateBoard('n')">N</div>
                    <div class="letter" id="m" onclick="updateBoard('m')">M</div>
                    <div class="letter" onclick="remove()">DEL</div>
                </div>
            </div>
        </div>
        <script type="module" src="wordleScript.js"></script>
    </body>
</html>
